# Bundled modules use separate non-overlapping 15x15 cells; their heights may differ.
modules:
  entrance:
    type: ENTRANCE
    schematic: entrance.schem
    rotations: [0, 90, 180, 270]
    connectors: &straight
      - {id: west, kind: ENTRY, y: 1, direction: WEST}
      - {id: east, kind: EXIT, y: 1, direction: EAST}
  transition:
    type: TRANSITION
    schematic: transition.schem
    rotations: [0, 90, 180, 270]
    connectors: *straight
  exit:
    type: EXIT
    schematic: exit.schem
    rotations: [0, 90, 180, 270]
    connectors:
      - {id: inside, kind: ENTRY, y: 1, direction: WEST}
  stairs_up:
    type: STAIRS_UP
    schematic: stairs_up.schem
    rotations: [0, 90, 180, 270]
    connectors:
      - {id: inside, kind: ENTRY, y: 1, direction: EAST}
  stairs_down:
    type: STAIRS_DOWN
    schematic: stairs_down.schem
    rotations: [0, 90, 180, 270]
    connectors:
      - {id: inside, kind: ENTRY, y: 6, direction: WEST}

  corridor_straight:
    type: NORMAL
    schematic: corridor_straight.schem
    weight: 5
    rotations: [0, 90]
    connectors: *straight
  room_straight:
    type: NORMAL
    schematic: room_straight.schem
    weight: 2
    rotations: [0, 90]
    connectors: *straight
    spawns: &room_spawns
      monsters:
        provider: VANILLA
        mob: ZOMBIE
        x: 7
        y: 1
        z: 7
        amount: 2
        radius: 3
        respawn: {mode: AFTER_DELAY, delay-seconds: 30}
        spawn-interval-ticks: 10
  corridor_corner:
    type: NORMAL
    schematic: corridor_corner.schem
    weight: 5
    rotations: [0, 90, 180, 270]
    connectors: &corner
      - {id: west, kind: ENTRY, y: 1, direction: WEST}
      - {id: south, kind: EXIT, y: 1, direction: SOUTH}
  room_corner:
    type: NORMAL
    schematic: room_corner.schem
    weight: 2
    rotations: [0, 90, 180, 270]
    connectors: *corner
    spawns: *room_spawns
  junction_t:
    type: NORMAL
    schematic: junction_t.schem
    weight: 4
    rotations: [0, 90, 180, 270]
    connectors: &junction_t
      - {id: west, kind: ENTRY, y: 1, direction: WEST}
      - {id: east, kind: EXIT, y: 1, direction: EAST}
      - {id: south, kind: GENERIC, y: 1, direction: SOUTH}
  room_t:
    type: NORMAL
    schematic: room_t.schem
    weight: 2
    rotations: [0, 90, 180, 270]
    connectors: *junction_t
    spawns: *room_spawns
  junction_cross:
    type: NORMAL
    schematic: junction_cross.schem
    weight: 3
    rotations: [0, 90, 180, 270]
    connectors: &junction_cross
      - {id: west, kind: ENTRY, y: 1, direction: WEST}
      - {id: east, kind: EXIT, y: 1, direction: EAST}
      - {id: north, kind: GENERIC, y: 1, direction: NORTH}
      - {id: south, kind: GENERIC, y: 1, direction: SOUTH}
  dead_end:
    type: DEAD_END
    schematic: dead_end.schem
    weight: 1
    rotations: [0, 90, 180, 270]
    connectors:
      - {id: entry, kind: ENTRY, y: 1, direction: WEST}
      - {id: closed, kind: EXIT, y: 1, direction: WEST}

  boss_straight:
    type: BOSS
    schematic: boss_straight.schem
    rotations: [0, 90]
    connectors: *straight
    spawns: &boss_spawn
      boss:
        provider: VANILLA
        mob: HUSK
        x: 7
        y: 1
        z: 7
        amount: 1
        radius: 0
        boss: true
        respawn: {mode: NEVER, delay-seconds: 0}
        spawn-interval-ticks: 0
  boss_corner:
    type: BOSS
    schematic: boss_corner.schem
    rotations: [0, 90, 180, 270]
    connectors: *corner
    spawns: *boss_spawn
  boss_t:
    type: BOSS
    schematic: boss_t.schem
    rotations: [0, 90, 180, 270]
    connectors: *junction_t
    spawns: *boss_spawn
  boss_cross:
    type: BOSS
    schematic: boss_cross.schem
    rotations: [0, 90, 180, 270]
    connectors: *junction_cross
    spawns: *boss_spawn
